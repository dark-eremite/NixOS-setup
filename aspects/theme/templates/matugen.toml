[config]
version_check = false
prefer = "saturation"
source_color_index = 0

[config.custom_colors]
white = { color = "#ffffff", blend = false }
black = { color = "#000000", blend = false }

[templates.niri]
input_path = "colors.kdl.j2"
output_path = "~/.config/niri/colors.kdl"

[templates.quickshell]
input_path = "colors.qml.j2"
output_path = "~/.config/quickshell/colors.qml"

[templates.alacritty]
input_path = "alacritty.toml.j2"
output_path = "~/.config/alacritty/alacritty.toml"

[templates.hyprlock]
input_path = "hyprlock.conf.j2"
output_path = "~/.config/hyprlock/colors.conf"
