source = ~/.config/hyprlock/colors.conf

general {
    hide_cursor = false
    disable_screencopy = true
    ignore_empty_input = true
    fail_timeout = 2000
}

auth {
    pam {
        enabled = true
        module = hyprlock
    }

    fingerprint {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/.wallpapers/current
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8917
    brightness = 0.8172
    vibrancy = 0.1686
    vibrancy_darkness = 0.05
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = $lock-accent
    check_color = $lock-accent
    fail_color = $lock-fg

    font_color = $lock-fg
    fade_on_empty = false
    rounding = 0

    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i>Input password...</i>
    fail_text = $PAMFAIL$FPRINTFAIL

    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}
